server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # /testeinicial -> /testeinicial/ sem trocar o domínio nem a porta (quem atende o público é o proxy do servidor)
    absolute_redirect off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # Arquivos do build têm hash no nome: nunca mudam
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri =404;
    }

    # Quadros dos vídeos: pesados, vale guardar no navegador. Trocar o vídeo = esperar 7 dias ou mudar o nome da pasta.
    location ~ ^/[^/]+/quadros/ {
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri =404;
    }

    # Laboratório: fora do Google
    location = /robots.txt {
        default_type text/plain;
        add_header X-Robots-Tag "noindex, nofollow" always;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location / {
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri $uri/ =404;
    }
}
